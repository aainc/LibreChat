server {
    listen 80;
    server_name ax-assessment.chieco.chat;
    client_max_body_size 2m;
    include snippets/oauth2-locations.conf;
    # MCP clients and the app's own OAuth server (Bearer-authenticated by the app) bypass oauth2-proxy.
    location ~ ^/((mcp|token|authorize|register|revoke|healthz)(/|$)|\.well-known/|auth/google/callback$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        include snippets/oauth2-protect.conf;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
